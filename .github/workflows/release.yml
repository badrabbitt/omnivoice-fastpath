name: Publish to PyPI

# Publishes when you create a GitHub release. Authentication is Trusted
# Publishing (OIDC): PyPI verifies the workflow identity directly, so there is
# no API token anywhere in this repo or in Actions secrets.
#
# One-time setup at https://pypi.org/manage/account/publishing/
#   PyPI project name: omnivoice-fastpath
#   Owner:             badrabbitt
#   Repository:        omnivoice-fastpath
#   Workflow:          release.yml
#   Environment:       pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      # Refuse to publish a version that does not match the release tag,
      # because a version can never be re-uploaded to PyPI once taken.
      - name: Check version matches tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag pyproject=$version"
          test "$tag" = "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
